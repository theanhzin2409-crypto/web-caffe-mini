<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông tin cá nhân - Caffe Mini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg cm-navbar"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Caffe Mini</a><div class="navbar-nav ms-auto"><a class="nav-link" href="index.html">Trang chủ</a><a class="nav-link" href="sell.html">Bán hàng</a><a class="nav-link d-none" id="navAdminItem" href="admin.html">Quản trị</a><a class="nav-link active" href="profile.html">Cá nhân</a><a class="nav-link" href="#" id="logoutBtn">Đăng xuất</a></div></div></nav>
<div class="container my-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="profile-head text-center mb-4"><div class="profile-avatar"><i class="fa-solid fa-user"></i></div><span class="admin-kicker">PERSONAL PROFILE</span><h2>Thông tin cá nhân</h2><p>Quản lý thông tin tài khoản đang sử dụng.</p></div><div class="card profile-card"><div class="card-header profile-card-head"><i class="fa-solid fa-id-card me-2"></i>Thông tin tài khoản</div><div class="card-body p-4 p-lg-5"><form id="profileForm"><div class="mb-3"><label class="form-label">Tên đăng nhập</label><input id="profileUsername" class="form-control" disabled /></div><div class="mb-3"><label class="form-label">Họ tên</label><input id="profileName" class="form-control" required /></div><div class="mb-3"><label class="form-label">Email</label><input id="profileEmail" type="email" class="form-control" required /></div><div class="mb-3"><label class="form-label">Số điện thoại</label><input id="profilePhone" class="form-control" required /></div><div class="mb-3"><label class="form-label">Mật khẩu mới <span class="text-muted">(để trống nếu không đổi)</span></label><input id="profilePass" type="password" class="form-control" /></div><button class="btn btn-warning fw-bold">Lưu thay đổi</button></form></div></div></div></div></div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastArea"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>bootPage("profile"));</script>
</body>
</html>
