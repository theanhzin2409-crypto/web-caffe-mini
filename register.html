<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký nhân viên - Caffe Mini</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-bg-pro">
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4"><div class="card auth-card p-4 p-lg-5">
    <div class="text-center mb-4"><div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div><span class="admin-kicker">STAFF ACCOUNT</span><h3 class="mt-2 fw-bold cm-title-color">Đăng ký nhân viên</h3><p class="text-muted">Tạo tài khoản để truy cập khu vực bán hàng.</p></div>
    <form id="registerForm">
      <div class="mb-3"><label class="form-label">Họ tên</label><input id="regName" class="form-control" required /></div>
      <div class="mb-3"><label class="form-label">Tên đăng nhập</label><input id="regUsername" class="form-control" required /></div>
      <div class="mb-3"><label class="form-label">Email</label><input id="regEmail" type="email" class="form-control" required /></div>
      <div class="mb-3"><label class="form-label">Số điện thoại</label><input id="regPhone" class="form-control" required /></div>
      <div class="mb-3"><label class="form-label">Mật khẩu</label><input id="regPass" type="password" class="form-control" minlength="4" required /></div>
      <button class="btn btn-warning w-100 fw-bold" type="submit">Đăng ký</button>
      <p class="text-center mt-3 mb-0"><a href="login.html" class="cm-link">Đã có tài khoản? Đăng nhập</a></p>
    </form>
  </div>
</div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastArea"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>bootPage("register"));</script>
</body>
</html>
